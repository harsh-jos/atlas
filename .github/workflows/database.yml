name: CI and Cloud Run deployment
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://atlas:atlas-ci@localhost:5432/atlas
      JWT_SECRET: isolated-ci-signing-secret
      ATLAS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - name: Rebuild complete schema and verify repeatability
        run: |
          uv run python -m app.db.bootstrap
          uv run python -m app.db.bootstrap
          uv run alembic check
      - name: Backend and deployment lint
        run: uv run ruff check app tests ../deploy
      - name: Deployment configuration and failure handling
        run: uv run python -m unittest discover -s ../deploy -p 'test_*.py'
      - name: Backend regressions (Postgres must be available)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build

  images:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
          - image: web
            context: .
    env:
      PUBLISH_IMAGES: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.GCP_DEPLOY_ENABLED == 'true' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Select release image tag
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          # run_id remains stable when only a failed deployment job is rerun.
          if [[ "$PUBLISH_IMAGES" == "true" ]]; then
            : "${PROJECT_ID:?Set GCP_PROJECT_ID}"
            : "${REGION:?Set GCP_REGION}"
            TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/atlas/${IMAGE_NAME}:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          else
            TAG="atlas-${IMAGE_NAME}:ci-${GITHUB_SHA}"
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate image publishing on main only
        if: env.PUBLISH_IMAGES == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Log in to Artifact Registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and optionally publish ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=atlas-${{ matrix.image }},version=2
          cache-to: type=gha,scope=atlas-${{ matrix.image }},version=2,mode=max,ignore-error=true,timeout=2m

  deploy:
    needs: [database, frontend, images]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: atlas-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      PUBLIC_APP_URL: ${{ vars.ATLAS_PUBLIC_APP_URL }}
      API_IMAGE: ${{ format('{0}-docker.pkg.dev/{1}/atlas/api:{2}-{3}', vars.GCP_REGION, vars.GCP_PROJECT_ID, github.sha, github.run_id) }}
      WEB_IMAGE: ${{ format('{0}-docker.pkg.dev/{1}/atlas/web:{2}-{3}', vars.GCP_REGION, vars.GCP_PROJECT_ID, github.sha, github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --no-dev
        working-directory: backend
      - name: Prepare runtime configuration
        env:
          BACKEND_CONFIGURATION: ${{ secrets.ATLAS_BACKEND_ENV }}
          WEB_CONFIGURATION: ${{ secrets.ATLAS_WEB_ENV }}
        run: |
          umask 077
          export BACKEND_ENV_FILE="$RUNNER_TEMP/atlas-backend.yaml"
          export WEB_ENV_FILE="$RUNNER_TEMP/atlas-web.yaml"
          printf 'BACKEND_ENV_FILE=%s\nWEB_ENV_FILE=%s\n' "$BACKEND_ENV_FILE" "$WEB_ENV_FILE" >> "$GITHUB_ENV"
          printf '%s' "$BACKEND_CONFIGURATION" > "$BACKEND_ENV_FILE"
          printf '%s' "$WEB_CONFIGURATION" > "$WEB_ENV_FILE"
          backend/.venv/bin/python deploy/runtime_config.py --validate
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - name: Migrate and deploy
        run: bash deploy/cloud-run.sh
      - name: Remove runtime configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-backend.yaml" "$RUNNER_TEMP/atlas-web.yaml"
