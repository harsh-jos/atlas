name: Database schema and focused regressions
on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://atlas:atlas-ci@localhost:5432/atlas
      JWT_SECRET: isolated-ci-signing-secret
      ATLAS_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - name: Rebuild complete schema and verify repeatability
        run: |
          uv run python -m app.db.bootstrap
          uv run python -m app.db.bootstrap
          uv run alembic check
      - name: Focused database regressions (Postgres must be available)
        run: >-
          uv run pytest -q tests/test_database_limits.py tests/test_chat_projections.py
          tests/test_writes_api.py::test_editor_rejects_a_stale_revision
          tests/test_writes_api.py::test_parallel_editor_writes_charge_the_final_body
          tests/test_agent_endpoint.py::test_history_cursor_keeps_older_turns_accessible
