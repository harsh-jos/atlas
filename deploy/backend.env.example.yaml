# Copy outside the repository; pass its absolute path as BACKEND_ENV_FILE.
AUTH_PROVIDER: supabase
SUPABASE_URL: https://YOUR_PROJECT.supabase.co
STORAGE_BACKEND: supabase
SUPABASE_STORAGE_BUCKET: atlas-assets
# Runtime secrets: keep this completed file outside the repository. In CI, store the
# complete YAML as the GitHub Actions secret ATLAS_BACKEND_ENV.
DATABASE_URL: 'postgresql://postgres.PROJECT_REF:ENCODED_PASSWORD@POOLER_HOST:5432/postgres?sslmode=require'
SUPABASE_SERVICE_KEY: 'sb_secret_YOUR_KEY'
DB_POOL_SIZE: '2'
DB_MAX_OVERFLOW: '0'
DB_POOL_RECYCLE_SECONDS: '300'
VERTEX_PROJECT: YOUR_GCP_PROJECT
VERTEX_LOCATION: global
AGENT_MODEL: gemini-4-argon
AGENT_SEARCH_MODEL: gemini-4-argon
AGENT_TURN_TIMEOUT_SECONDS: '900'
AGENT_MAX_CALLS_PER_TURN: '20'
AGENT_EXECUTION_BACKEND: cloud_tasks
# cloud-run.sh supplies the queue, location, API URL and OIDC identity after deployment.
AGENT_EXTRACTION_MODEL: gemini-3.8-flash
AGENT_IMAGE_MODEL: gemini-3.1-flash-image
AGENT_MAX_IMAGES_PER_TURN: '2'
AGENT_MAX_ACTIVE_TURNS: '8'
AGENT_MAX_ACTIVE_TURNS_PER_USER: '1'
STORAGE_QUOTA_BYTES: '52428800'
MAX_ASSET_BYTES: '10485760'
AGENT_ACCOUNT_BUDGET_MICROUSD: '3000000'
