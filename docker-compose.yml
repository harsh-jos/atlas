name: atlas

# One command brings up the whole local stack: `docker compose up --build`.
# Postgres (with pgvector), the Python backend, and the Next.js app.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Python backend owns the schema and agent sessions.
  pipeline:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env — the backend refuses to sign with a default}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.5-flash}
      ASSETS_DIR: /data/assets
    volumes:
      - pipeline_data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${IMPORT_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_API_URL: http://pipeline:8000
    depends_on:
      pipeline:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  pipeline_data:
