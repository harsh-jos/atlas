[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas learning agent and knowledge API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pyjwt[crypto]>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    "google-adk==2.5.0",
    "google-genai>=2.30.1",
    "greenlet>=3.5.4",
]

# This is an application, not a distributable package — don't try to build it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
